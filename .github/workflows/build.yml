name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow-urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      # Compares the new build with the live site, so it has to run before deploy.
      # A failure here must never block the deploy.
      - id: indexnow
        continue-on-error: true
        run: echo "urls=$(python scripts/indexnow.py changed)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      # v4 and v5 strip every dot-path from the artifact, which silently drops
      # site/.well-known/ and 404s the agent catalogs. v5 can be told not to.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After deploy, so the key file and the new pages are live when search engines fetch them.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow-urls != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/indexnow.py submit
        env:
          URLS: ${{ needs.build.outputs.indexnow-urls }}
