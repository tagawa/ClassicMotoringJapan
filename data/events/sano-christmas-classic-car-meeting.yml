summary_en: >
  Up to 120 vehicles built between 1946 and 2000, plus prewar ones, at the club's
  last meeting of the year. Cars, kei cars, motorcycles, three-wheelers and
  lorries are accepted, Japanese and imported. Miniature cars, supercars, the Copen and Mitsuoka cars
  are accepted from any year. Christmas colours get priority. There are 20 swap
  meet stalls selling parts, catalogues and models.
