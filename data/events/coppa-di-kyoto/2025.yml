slug: coppa-di-kyoto
year: 2025
status: confirmed
start: 2025-05-31
end: 2025-06-01
# Times, places and the 1975 limit are from the guide for entrants dated 2025-01-20
# (download/25coppadikyoto_guide.pdf), whose text layer is garbled, so render it.
# It gives no place for the second day's 8:30 start; the hotel is where it says the
# cars finished and stayed the night before.
# The entry list is an image (imgentrylist/entrylist2025_02.jpg, posted 2025-05-30)
# with no crew names; its car names match the day-one result sheet by number.
# - Entry 55, a Siata, is listed as "1937・1947", so it has no single year here.
# - On the day, the result sheet has other cars at 27 and 70 and none at 34 or 58;
#   this is the list as published beforehand.
# - Each car's country is the list's own column (I, GB, D, F, USA, J, S).
source_url: https://www.coppa-di-kyoto.com/
last_verified: 2026-10-13
sequence: 0
cutoff_year: 1975
route_en: >
  The 11th edition, run with Kyoto Prefecture on its "Mori no Kyoto" (forest)
  and "Umi no Kyoto" (sea) themes. The organiser published start and finish
  times only, with no checkpoints between them.
route:
  - date: 2025-05-31
    checkpoints:
      - start_time: "08:00"
        place_en: Kyoto Prefectural Office (cars check in)
        place_ja: 京都府庁
        prefecture: Kyoto
      - start_time: "09:30"
        place_en: Kyoto Prefectural Office (start)
        place_ja: 京都府庁
        prefecture: Kyoto
      - start_time: "17:30"
        place_en: Mercure Kyoto Miyazu Resort & Spa, Miyazu (finish)
        place_ja: メルキュール京都宮津リゾート&スパ
        prefecture: Kyoto
  - date: 2025-06-01
    checkpoints:
      - start_time: "08:30"
        place_en: Mercure Kyoto Miyazu Resort & Spa, Miyazu (start)
        place_ja: メルキュール京都宮津リゾート&スパ
        prefecture: Kyoto
      - start_time: "11:00"
        place_en: Arashiyama-Takao Parkway, car park inside the Takao gate (finish)
        place_ja: 嵐山-高雄パークウェイ 高雄口ゲート内大駐車場
        prefecture: Kyoto
