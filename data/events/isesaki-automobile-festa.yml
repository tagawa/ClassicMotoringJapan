slug: isesaki-automobile-festa
name_en: Isesaki Automobile Festa
name_ja: 伊勢崎オートモービルフェスタ
organizer: 伊勢崎オートモービルフェスタ実行委員会 (Isesaki Automobile Festa Executive Committee)
official_url: https://1000-kaze.com/iamf/
summary_en: >
  A one-day show in the east car park of the auto race track at Isesaki in
  Gunma. The organizer expects about 250 Japanese and foreign cars, old and new,
  from classics to supercars. Self-Defense Force and fire service vehicles are
  listed as planned. More than ten dealer stands, a flea market and more than
  ten food trucks run alongside.
prefecture: Gunma
venue_en: Isesaki Auto Race, east car park
street_address: 3074 Miyakocho, Isesaki, Gunma (群馬県伊勢崎市宮子町3074)
lat: 36.3351
lon: 139.1633
nearest_station: Isesaki (JR Ryomo and Tobu Isesaki lines), or Komagata (JR Ryomo line)
access_notes_en: >
  Neither station is walkable. The track gives about 10 minutes by taxi from
  either, ¥1,500 from Isesaki and ¥1,700 from Komagata, and its free shuttle bus
  runs on race days only. By car, the site is 1.3 km from Komagata IC.
typical_scale: About 250 vehicles
spectator_fee_jpy: 0
spectator_notes_en: >
  Free to watch. Visitors park on the south side of the auto race track and walk
  in, since the venue car park is for exhibitors only.
last_verified: 2026-09-23
