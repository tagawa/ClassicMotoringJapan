slug: tenri-yamanobe-classic-car-fes
name_en: Tenri Yamanobe Classic Car Fes
name_ja: 天理やまのべクラシックカーフェス
organizer: 天理やまのべクラシックカーフェス実行委員会 (Tenri Yamanobe Classic Car Fes Committee)
official_url: https://classiccarfes.mahoratenri.com/
summary_en: >
  A one-day show of Japanese and imported cars, chosen by the committee from
  models built or announced up to 1995, plus some sponsors' and guests' cars. The
  2026 list runs from 1932 to 1999. There are stage and children's events, food
  trucks, a market and a visitors' vote for favourite car. Also held in 2024 and
  2025.
prefecture: Nara
# 乗降場 is a boarding and alighting area. No source gives the reading of 北大路
# here, so the Japanese name stays in the address line.
venue_en: Tenrikyo boarding area, Toyodacho, Tenri
street_address: 130-1 Toyodacho, Tenri, Nara (奈良県天理市豊田町130-1, 天理教北大路乗降場)
lat: 34.6050
lon: 135.8400
nearest_station: Tenri (JR and Kintetsu)
access_notes_en: >
  The organiser's site gives the walk from Tenri station as both 12 and 20
  minutes. About 10 minutes by car from Tenri IC on the Nishi-Meihan Expressway.
  Temporary visitors' parking is free, including a car park about 4 minutes' walk
  north of the venue, and may fill up.
typical_scale: About 120 cars
spectator_fee_jpy: 500
spectator_notes_en: >
  Free for high-school students and younger. The show runs in rain and is
  cancelled only in severe weather. Pets and bicycles are not allowed on the site.
last_verified: 2026-11-03
