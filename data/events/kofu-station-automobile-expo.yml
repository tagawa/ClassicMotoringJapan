slug: kofu-station-automobile-expo
name_en: Kofu Station Automobile Expo
name_ja: 甲府駅自動車博覧會
organizer: モグラハウス (Mogura House)
# An events company in Yamanashi; its news page carries each year's details. The
# post names a staff contact with a mobile number, which does not go here.
official_url: https://www.mogurahouse.com/release/
summary_en: >
  Vintage cars and old motorcycles, Japanese and imported, built up to 1995, in
  the plaza outside Kofu station's north exit. Illegally modified vehicles are
  refused. There are also talk shows, a flea market and kitchen cars. The 25
  October 2026 running was postponed to 3 January 2027. October's announcement
  had a stage show and a 14:00 parade through Kofu; January's lists neither.
prefecture: Yamanashi
venue_en: Yocchabare Hiroba, Kofu station north exit
street_address: 2-2-1 Kitaguchi, Kofu, Yamanashi (山梨県甲府市北口2丁目2-1)
# The pin is GSI's for the address, 80 m from OSM's north exit bus stop; both
# reverse-geocode to Kitaguchi 2-chome.
lat: 35.6677
lon: 138.5701
nearest_station: Kofu (JR Chuo line, Minobu line)
# Free per the October 2026 post; the January post doesn't repeat it.
spectator_fee_jpy: 0
spectator_notes_en: >
  Free to watch. Show cars arrive between 8:30 and 9:30. Motorcycles enter on the
  day only.
