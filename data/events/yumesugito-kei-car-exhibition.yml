name_en: Showa-Heisei Kei Car Exhibition at Agri Park Yumesugito
name_ja: 昭和平成軽自動車展示会
organizer: 日本旧軽車会 (Nihon Kyukeisha-kai)
# The club has no site of its own. This post reproduces its flyer and entry form.
official_url: https://minkara.carview.co.jp/userid/2251740/blog/49416626/
summary_en: |
  Up to 200 vehicles built between 1946 and 2000. Places by class:
  - 100 kei cars of 360, 550 and 660cc
  - 30 Japanese and imported cars of up to 1,000cc
  - 20 Skyline GT-Rs
  - 50 other Japanese and imported cars

  Bubble cars and motorcycles of up to 125cc are shown too. Miniature cars, the
  Copen, unusual cars and customised kei cars are accepted from any year. There
  are 20 swap meet stalls.
