slug: coppa-di-himeji
year: 2026
status: confirmed
start: 2026-06-06
end: 2026-06-07
# Times and places are the text of the route guide page, last edited 2026-05-26.
# It names the towns in order (姫路市, 加西市, 淡路市, 西脇市, 宍粟市), which is where
# Kasai for Kotani and Awaji for the park come from. The entry list is an HTML table
# (entry-list, last edited 2026-05-31) with a driver column that is not copied. Each
# car's country is its "Crafted" column (I, GB, D, F, USA, J), written as ISO codes.
source_url: https://coppa-di-himeji.com/root-map
last_verified: 2026-10-13
sequence: 0
route_en: >
  Times are for the lead car and can shift a little. The second day ran from
  Arcrea Himeji round Himeyama Park, through the Tegara and Hamate areas, out to
  Murotsu and Aioi, and back along Route 2; the organiser gave no times between
  start and finish.
route:
  - date: 2026-06-06
    checkpoints:
      - start_time: "08:50"
        place_en: Himeji Otemae Park (start, timed trial)
        place_ja: 姫路大手前公園
        prefecture: Hyogo
      - start_time: "09:30"
        place_en: Kotani, Kasai (timed trial)
        place_ja: 株式会社コタニ
        prefecture: Hyogo
      - start_time: "12:20"
        place_en: Akashi Kaikyo National Government Park, Awaji (display run)
        place_ja: 国営明石海峡公園
        prefecture: Hyogo
      - start_time: "14:35"
        place_en: Nishiwaki City Hall (timed trial)
        place_ja: 西脇市役所
        prefecture: Hyogo
      - start_time: "15:35"
        place_en: Shiso City Hall (timed trial)
        place_ja: 宍粟市役所
        prefecture: Hyogo
      - start_time: "16:45"
        place_en: Arcrea Himeji (arrival)
        place_ja: アクリエひめじ
        prefecture: Hyogo
  - date: 2026-06-07
    checkpoints:
      - start_time: "09:50"
        place_en: Arcrea Himeji (start)
        place_ja: アクリエひめじ
        prefecture: Hyogo
      - start_time: "12:20"
        place_en: Himeji Otemae Park (finish)
        place_ja: 姫路大手前公園
        prefecture: Hyogo
