summary_en: >
  Vintage and classic cars on the lawn at Karuizawa Prince Shopping Plaza, alongside
  new models, test drives and lifestyle stands. First held in 2022, by a committee
  including Culture Convenience Club and the publishers Geibunsha and Neko Publishing.
  The 2026 Concours of Elegance, for open cars, ran from a 1932 Ford to a 2022
  Porsche, and an auction was held on the Sunday.
