slug: coppa-di-himeji
name_en: Coppa di Himeji
name_ja: コッパディ姫路
organizer: COPPA GIAPPONE, run by コッパディ姫路実行委員会 (Coppa di Himeji organising committee)
official_url: https://coppa-di-himeji.com/
summary_en: >
  A two-day rally from Himeji Otemae Park, in front of Himeji Castle, around
  southern Hyogo. It runs every other year, alternating with Coppa di Kyoto:
  2015, 2017, 2019, 2022, 2024 and 2026 so far. The next is planned for early
  summer 2028, with entries opening around December 2027.
prefecture: Hyogo
venue_en: Himeji Otemae Park (start and finish)
