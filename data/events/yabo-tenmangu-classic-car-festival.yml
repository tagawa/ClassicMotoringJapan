slug: yabo-tenmangu-classic-car-festival
name_en: Yabo Tenmangu Classic Car Festival
name_ja: 谷保天満宮旧車祭
organizer: Automobile Club Japan
official_url: https://acj1908.com/kyusya.html
summary_en: >
  About 190 cars built up to 2000, plus supercars and other
  cars the organiser approves, at Yabo Tenmangu shrine and two car parks nearby.
  It marks Japan's first petrol-car touring run, which ended at the shrine in 1908
  and where Automobile Club Japan was founded. The cars receive a road safety
  blessing, and a working replica of the Takuri, Japan's first home-built petrol car, is
  shown. The club's archive has flyers from 2012 onwards.
prefecture: Tokyo
venue_en: Yabo Tenmangu shrine, Kunitachi, and two nearby car parks
street_address: 5209 Yaho, Kunitachi, Tokyo (東京都国立市谷保5209)
lat: 35.6801
lon: 139.4439
nearest_station: Yaho (JR Nambu line)
access_notes_en: >
  The third site is the JA Tokyo Midori Fujimidai branch car park by the
  station's north exit. A free tuk-tuk shuttle runs between the shrine and that
  car park from 9:30 to 13:45, at no fixed times. Visitors coming by car use
  nearby paid car parks.
typical_scale: About 190 cars
spectator_fee_jpy: 0
spectator_notes_en: >
  Free to watch at all three sites. The festival runs in rain.
cutoff_year: 2000
