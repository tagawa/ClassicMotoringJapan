slug: miura-peninsula-classic-cars
name_en: Miura Peninsula Classic Car Gathering
name_ja: 三浦半島に集まる名車たち@ソレイユの丘
organizer: リバイバルカフェ (Revival CAFE)
official_url: https://revivalmiura.com/?page_id=1539
summary_en: >
  A one-day show at Soleil no Oka, a public park at Yokosuka on the Miura
  Peninsula, put on by Revival CAFE, a café in Miura, with the park's operator.
  In 2025 about 200 entered cars filled car park 3, with a themed display on
  the Hilltop Plaza beside it and stands from car businesses and dealers in
  car goods. The 2025 theme was a century of the Showa era told through its cars.
prefecture: Kanagawa
venue_en: Soleil no Oka (Nagai Uminote Park)
street_address: Nagai 4-chome, Yokosuka, Kanagawa (神奈川県横須賀市長井4丁目)
lat: 35.1951
lon: 139.6127
nearest_station: Misakiguchi (Keikyu Kurihama line)
access_notes_en: >
  Keikyu buses bound for Soleil no Oka take about 15 minutes to the terminus.
  On foot it is about 4 km, around 45 minutes. By car, about 3 km from the
  Hayashi exit of the Miura Jukan Road.
typical_scale: About 200 entered cars
spectator_fee_jpy: 0
spectator_notes_en: >
  Park admission is free, and the show is open to every park visitor, not only
  entrants. The park charges for parking: ¥1,200 for an
  ordinary car at weekends and on holidays, since April 2025.
last_verified: 2026-09-25
