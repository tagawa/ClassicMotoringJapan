slug: automobile-council
name_en: Automobile Council
name_ja: オートモビル カウンシル
organizer: AUTOMOBILE COUNCIL実行委員会 (Automobile Council Committee)
official_url: https://automobile-council.com/
summary_en: >
  A three-day spring show at Makuhari Messe built around heritage cars, held every
  year since 2016. Dealers show cars for sale, in principle built 25 or more years ago,
  beside stands from carmakers and owners' clubs, a market for automobilia, an art
  gallery, talks and live music. The 2026 show had 39,688 visitors over three days.
prefecture: Chiba
venue_en: Makuhari Messe
