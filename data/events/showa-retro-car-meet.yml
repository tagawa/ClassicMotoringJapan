slug: showa-retro-car-meet
name_en: Showa Retro Car Meet
name_ja: 昭和レトロカーミート
organizer: 昭和レトロカーミート実行委員会 (Showa Retro Car Meet Committee, at Yaesu Publishing)
official_url: https://retrocar.yaesu-net.co.jp/
summary_en: >
  A one-day meet in a shopping centre car park at Soga in Chiba, presented by
  Old-timer magazine. Cars are shown in two classes, which the organizer calls
  retro and neo-classic, and the 2026 entry list runs from a 1948 car to a 2024
  restomod. A swap meet of parts and memorabilia runs alongside.
prefecture: Chiba
venue_en: Festival Walk Soga, shared car park 2
street_address: 51-1 Kawasakicho, Chuo, Chiba (千葉県千葉市中央区川崎町51-1)
lat: 35.5930
lon: 140.1178
nearest_station: Soga (JR Keiyo, Uchibo and Sotobo lines)
access_notes_en: >
  Thirty minutes on foot from the west exit. A free shuttle bus to Harbour City
  Soga leaves about every 15 minutes and takes about 15. Nearby roads are
  expected to be congested.
typical_scale: 167 cars listed for 2026, with more on the day
spectator_fee_jpy: 1500
spectator_notes_en: >
  Advance tickets are ¥1,200 until the day before; ¥1,500 at the gate. Free for
  junior high school age and under, and for a disabled visitor with one
  companion on showing a disability handbook. Re-entry needs the ticket stub.
  The meet runs in rain.
last_verified: 2026-09-22
