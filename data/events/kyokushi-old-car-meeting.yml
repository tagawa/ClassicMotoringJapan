summary_en: >
  A meeting for Showa-era cars, built up to 1988, at the Kyokushi roadside station
  in Kikuchi. First held in 2026, as a local revitalisation event. Illegally
  modified cars are not admitted, and revving, loud exhausts and reckless driving
  are banned.
