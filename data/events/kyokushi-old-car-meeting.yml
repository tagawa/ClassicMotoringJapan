summary_en: >
  A meeting for cars built in the Showa era, up to 1988, held at the Kyokushi
  roadside station in Kikuchi as a local revitalisation event. 2026 is the first.
  Illegally modified cars are not admitted, and revving, loud exhausts and
  reckless driving are banned.
prefecture: Kumamoto
