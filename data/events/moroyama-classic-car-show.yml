summary_en: >
  Up to 100 vehicles built between 1946 and 2000, plus prewar ones: Japanese and
  imported cars, motorcycles and three-wheelers. Mitsuoka cars, supercars, the
  Copen and German cars are accepted from any year. The 2027 show features 360cc
  kei cars, German cars, British cars and the Mini Cooper. It is a display only,
  with no swap meet or catering. First held in 2026.
