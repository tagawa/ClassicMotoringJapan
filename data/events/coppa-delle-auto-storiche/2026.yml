# First announced for 3 and 4 October (the organiser's notice of 19 November 2025), then
# moved to 17 and 18 October by the outline of July 2026, before this site listed it,
# so sequence stays 0. The cars are from the entry list page, updated 10 October 2026
# by the site's own news. Each car's country is the list's own column, except four the
# column has wrong: 12 (Austin-Healey, given as Germany), 20 (Porsche, Britain), 26
# (Nissan, Italy) and 31 (Lancia, Germany). Spellings corrected from the list: Ballila to
# Balilla (4), Bellet to Bellett (27), 2000GTR to 2000GT-R (26), Auto Bianchi to
# Autobianchi (50), and the makes' and models' capitals to the house casing.
