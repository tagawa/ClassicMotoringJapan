slug: tokorozawa-classic-car-festival
name_en: Classic Car Festival in Tokorozawa
name_ja: クラシックカーフェスティバルinところざわ
organizer: ところざわクラシックカークラブ (Tokorozawa Classic Car Club)
# The club's own page gives the date, times and eligibility; the scale comes from
# Response's report on the 2024 edition (response.jp/article/2024/10/23/387707.html).
# The site's certificate is for another host, so the address stays http.
official_url: http://www.tokorozawa-classiccarclub.jp/festival-info.htm
summary_en: >
  Cars and motorcycles fill the training course of a driving school at
  Sayamagaoka, beside a large swap meet. The club behind it was formed in 1996
  and has run the festival since. In 2024 about 275 vehicles took part, built in
  1979 or earlier or later versions of models that were.
prefecture: Saitama
venue_en: Tokorozawa Jidosha Gakko (driving school), training course
street_address: 2-879-5 Higashi-Sayamagaoka, Tokorozawa, Saitama (埼玉県所沢市東狭山ケ丘2-879-5)
lat: 35.8109
lon: 139.4201
nearest_station: Sayamagaoka (Seibu Ikebukuro line)
access_notes_en: >
  Two minutes' walk from the east exit. From 2026 there is no visitors' car park;
  the organiser asks visitors to come by train or bus. There is space for
  bicycles and motorcycles.
typical_scale: About 270 vehicles
# Free, per the driving school's event page (tokorozawa-jidoshagakko.co.jp/event/).
spectator_fee_jpy: 0
cutoff_year: 1979
last_verified: 2026-10-16
