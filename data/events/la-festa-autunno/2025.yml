route_en: >
  The 28th running and the first under the La Festa Autunno name, over four days.
  Day 1, 26 September: the start ceremony at Jingubashi in Harajuku between 11:05
  and 11:35, then Nasunogahara Park and the Tsukuruma circuit at Nasushiobara in
  Tochigi, Nishigo and Tenei in Fukushima, the Noguchi Hideyo Memorial Hall and
  the ski ground at Inawashiro, and the night halt at Urabandai. Day 2, 27
  September: the Bandai eruption museum, the Nakatsugawa gorge, Jododaira on the
  Bandai-Azuma Skyline, the Link circuit, Fukushima Sky Park and Iizaka Onsen at
  Fukushima City, then Shiroishi and Shichikashuku in Miyagi, Onogawa Onsen in
  Yamagata, Kitakata and the Ouchi-juku post town, finishing at the Kanaya hotels
  in Nikko. Day 3, 28 September: Shioya, the Shinoi Ring at Utsunomiya, Sakura
  and Motegi in Tochigi, Kasama Inari shrine and Oarai marina in Ibaraki, then
  Sawara old town and Narita in Chiba. Day 4, 29 September: Naritasan, Shibayama,
  the Kujukuri coast at Kujukuri and Ichinomiya, Onjuku, Katsuura, Yorokeikoku
  station on the Kominato railway, Kisarazu and Tokyo German Village at
  Sodegaura, then the finish ceremony on Valentine Street at Makuhari Bay Town in
  Chiba City between 15:30 and 17:00.
