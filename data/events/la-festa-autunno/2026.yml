route_en: >
  The 29th running, over four days. Day 1, 2 October: away from Harajuku and
  Omotesando between 11:05 and 11:35, then north to Nasunogahara Park and the
  Tsukuruma circuit at Nasushiobara in Tochigi, on through Nishigo and Tenei in
  Fukushima and along Lake Inawashiro to the night halt at Urabandai. Day 2, 3
  October: round Lake Hibara and over into Yamagata for Yonezawa ski ground, back
  to the Link circuit, Fukushima Sky Park and Iizaka Onsen at Fukushima City,
  then Shiroishi and Shichikashuku in Miyagi, Onogawa Onsen, Kitakata and the
  Ouchi-juku post town, finishing the day at the Kanaya hotels in Nikko. Day 3, 4
  October: the Kirifuri ice arena, Shioya and Sakura in Tochigi, then Kasama
  Inari shrine and Oarai marina in Ibaraki, and into Chiba for Sawara old town
  and Narita. Day 4, 5 October: Shibayama, the Kujukuri coast at Kujukuri,
  Ichinomiya and Onjuku, Katsuura, the Oyama rice terraces at Kamogawa and the
  Magarigawa Club, then the finish at Makuhari Bay Town in Chiba City between
  15:30 and 17:00. Tokyo and eight prefectures in all; Gunma and Saitama are
  passed through without a checkpoint.
