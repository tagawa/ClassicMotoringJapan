# Parade times from the organiser page's timetable image; the course from the class A
# entry rules there. The sites are listed in the source's order, which need not be the
# order driven. The entry list was not yet published on 2026-11-27.
route_en: >
  Class A cars drive the Asuka-Fujiwara Historic Parade from 10:40 to 13:20. Its
  course takes in the Asuka Palace site, Asuka-dera, the Asuka Mizuochi site, the
  Fujiwara Palace site, the Motoyakushiji site, Ishibutai Kofun and Kashihara Jingu.
  Entrants may stop at the Nara National Research Institute for Cultural
  Properties' Kashihara museum (橿原資料館), the Nara Prefecture Complex of Man'yo
  Culture and Ishibutai Kofun.
