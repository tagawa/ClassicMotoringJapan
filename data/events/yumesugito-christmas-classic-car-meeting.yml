summary_en: >
  Up to 300 vehicles built between 1946 and 2000, plus prewar ones: cars, kei
  cars, motorcycles, three-wheelers and lorries, Japanese and imported. Miniature
  cars, supercars, the Copen and Mitsuoka cars are accepted from any year, and
  later cars by arrangement. Christmas colours (white, red and green) get priority. There are 30 swap meet
  stalls.
