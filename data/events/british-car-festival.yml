slug: british-car-festival
name_en: British Car Festival
name_ja: 英国車祭
organizer: 英国車クラブ東海 (a club for British car owners in the Tokai area, formed in 2023)
official_url: https://eikokusha.my.canva.site/
summary_en: >
  A yearly gathering of British cars of every age, from Austin, MG, Jaguar and the
  classic Mini to Lotus, Caterham, Morgan and Aston Martin. A Tokai-area owners'
  club runs it. First held in 2025. The second, at Takayama in Gifu in October
  2026, had about 130 cars and a waiting list for entries. The 2027 festival is at
  Little World in Inuyama, with places for 200 cars and British cars given
  priority in selection.
prefecture: Aichi
venue_en: Little World, Inuyama
venue_ja: 野外民族博物館リトルワールド（犬山市）
street_address: 90-48 Imai, Inuyama, Aichi (愛知県犬山市今井成沢90-48)
# GSI's point for the address, which falls inside OSM's outline of the museum
# on its west side.
lat: 35.3731
lon: 137.0189
nearest_station: Inuyama (Meitetsu Inuyama line)
access_notes_en: |
  Gifu Bus from Inuyama station takes about 20 minutes. Inuyama is:
  - about 30 minutes from Meitetsu Nagoya
  - about 40 minutes from Meitetsu Gifu

  The car park in front of the entrance costs, cash only:
  - ¥1,000 a car
  - ¥500 a motorcycle

  The 2026 festival was held elsewhere, at Wood Forum Hida in Takayama, Gifu.
# About 130 came to Takayama in 2026; the 2027 flyer offers 200 places at Little World.
typical_scale: About 130 cars, with room for 200 at Little World
spectator_fee_jpy: null
spectator_notes_en: >
  The organiser's page gives no spectator arrangements for 2027: neither a fee
  nor whether the cars stand inside the museum grounds. It gives the hours,
  9:00 to 15:00, as planned.
