slug: fujioka-oldies
name_en: Fujioka Oldies
name_ja: 藤岡オールディーズ
organizer: Fujioka オールディーズ実行委員会 (Fujioka Oldies Executive Committee)
official_url: https://www.instagram.com/f.oldies0612/
summary_en: >
  A one-day street show in central Fujioka, Gunma. The Chuo-dori shopping
  street is closed to traffic between the 4-chome and 7-chome traffic lights,
  and American cars, vintage cars, custom cars and motorcycles line it. Food,
  goods and craft stalls and a live music stage run alongside. First held in
  2024; more than 50 cars came in 2025.
prefecture: Gunma
venue_en: Chuo-dori shopping street, Fujioka
