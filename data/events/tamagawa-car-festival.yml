slug: tamagawa-car-festival
name_en: Tamagawa Car Culture Festival
name_ja: 趣味人の「文化祭」
organizer: 趣味人の「文化祭」実行委員会 (Culture Festival Organising Committee)
official_url: https://www.takashimaya.co.jp/tamagawa/sc/event/?id=7216
summary_en: >
  An indoor show put on by クルマを愛する趣味人の会, a car club that meets every three
  months at the Tamagawa LOOP community space inside Tamagawa Takashimaya S.C. at
  Futako-tamagawa. This is its first public exhibition. Cars share the hall with
  owners' club stands, restorers, and dealers in scale models, books and automobilia.
prefecture: Tokyo
venue_en: Arena Hall, Tamagawa Takashimaya S.C. West Building 1F
street_address: 3-17-1 Tamagawa, Setagaya, Tokyo (東京都世田谷区玉川3-17-1)
lat: 35.6147
lon: 139.6260
nearest_station: Futako-tamagawa (Tokyu Den-en-toshi and Oimachi lines)
access_notes_en: >
  Two minutes' walk from the station. Arena Hall is on the first floor of the West
  Building, which is separate from the main store.
spectator_fee_jpy: 1000
spectator_notes_en: >
  Cash only at the door; cashless payment is not accepted. Free for primary school
  children and under. Last entry 16:30. The organiser says the exhibits may change,
  or the event be cancelled.
last_verified: 2026-09-21
