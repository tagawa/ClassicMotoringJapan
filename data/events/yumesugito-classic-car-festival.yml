slug: yumesugito-classic-car-festival
name_en: Showa-Heisei Classic Car Festival at Agri Park Yumesugito
name_ja: 昭和平成クラシックカーフェスティバル in アグリパークゆめすぎと
organizer: 日本旧軽車会 (Nihon Kyukeisha-kai)
# The club has no site of its own. This post reproduces its flyer and entry form.
official_url: https://minkara.carview.co.jp/userid/2251740/blog/49407885/
summary_en: >
  Up to 100 vehicles built between 1946 and 2000, plus prewar ones: cars, kei
  cars, motorcycles, three-wheelers and sidecars, Japanese and imported.
  Miniature cars, supercars and the Copen are accepted from any year. Each
  meeting features particular models; in 2027 the Mini, the Skyline GT-R, the
  Datsun Bluebird 310 to 320 and Mitsubishi cars. There are 20 swap meet
  stalls.
prefecture: Saitama
