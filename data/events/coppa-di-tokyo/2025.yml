# The date is on the 2025 poster (imgposter/2025_poster.jpg) and on the home page as
# archived on 2025-12-12. The cars and years are from the entry list image linked
# below, posted 2025-11-19, checked by number against the result sheet
# (download/19aCoppadiTokyo_2025_Result.pdf), which has no years.
# - The image numbers two cars 85; the result sheet has the MGB as 86.
# - Entry 61 is "BENTLEY" alone on the list; "3 1/2 Litre" is from the result sheet.
# - Entry 73, a Porsche 904, has a dash for its year and its country on the list, so it
#   has neither here; its flag is the make's. Every other car's country is the list's own
#   column (I, GB, D, F, USA).
# - The result sheet has no entry 8 and adds a 68 (an MGB, no year); neither change
#   is made here, since this is the list as published before the day.
# The 19th edition. No route_en: the organiser's site carries no route or timetable
# for it, and the field alone would give the page a Route section with no route.
