# From the guide for entrants dated 2026-09-01 (download/20a_coppac_di_tokyo_annai.pdf),
# whose text is outlined, so it has to be rendered to read. It gives the timetable as
# planned (予定): reception from 8:30, start from 10:00, finish from 12:00.
# The cars, years and countries are from the entry list image linked below, posted
# 2026-11-20 (entrylist.html). The list's countries I, D, F, USA, SWE and C are written
# as IT, DE, FR, US, SE and CN.
# - Entry 78, a Porsche 904 re-creation, has dashes for its year and country, so it has
#   neither here; its flag is the make's.
# - Entry 79 is an empty row, left out.
# - Entry 0, a 2024 BYD, is on the list despite the 1976 cutoff; the list does not say why.
source_url: https://www.coppa-di-tokyo.com/imgentrylist/entrylist2026_02.jpg
last_verified: 2026-11-22
sequence: 0
videos:
  # Video by nakanaka_jp.
  - youtube_id: l5kudZ01Dkg
    label_en: Cars arriving at the start in Shiodome
# From the 2026 guide. On the edition, not the event: the 2025 entry list has
# later cars and no source gives that year's limit.
cutoff_year: 1976
route_en: >
  The 20th edition. The organiser gave these times as planned (予定), and
  published no route through Tokyo.
route:
  - date: 2026-11-21
    checkpoints:
      - start_time: "08:30"
        place_en: Shiodome Nishi Park (cars check in)
        place_ja: 汐留西公園
        prefecture: Tokyo
      - start_time: "10:00"
        place_en: Shiodome Nishi Park (start)
        place_ja: 汐留西公園
        prefecture: Tokyo
      - start_time: "12:00"
        place_en: Shiodome Nishi Park (finish)
        place_ja: 汐留西公園
        prefecture: Tokyo
