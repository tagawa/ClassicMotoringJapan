slug: mito-classic-car-festival
name_en: Mito Classic Car Festival
name_ja: 水戸クラシックカーフェスティバル
organizer: 水戸クラシックカーフェスティバル実行委員会 (the festival's committee)
# The committee's entry form, the only page of its own found for 2027. The
