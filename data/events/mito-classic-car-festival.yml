summary_en: >
  Up to 500 Japanese and imported vehicles, entered in advance, on the shore of
  Lake Senba next to Kairakuen garden. In 2026 they had to be at least 20 years
  old, which let in classics, neo-classics, kei cars and commercial vehicles,
  and the theme car was the Crown, with a contest. There are shop stalls and a
  parts swap area.
prefecture: Ibaraki
venue_en: Senba Lake Park, Sakura, Fureai and Hanamizuki squares
venue_ja: 水戸千波湖公園 さくら広場・ふれあい広場・はなみずき広場
