slug: asuka-fujiwara-classic-car-festival
name_en: Asuka-Fujiwara Classic Car Festival
name_ja: 飛鳥・藤原クラシックカーフェスティバル
organizer: まほろばコネクト共同事業体 (Mahoroba Connect joint venture, led by Asuka Biso Co., Ltd.)
official_url: https://www.yamatosanzan.com/
summary_en: |
  A one-day show of about 100 Japanese and imported cars at Asuka village.
  Each class has its own limit:
  - A: 35 cars to 1985, which also drive a World Heritage parade
  - B: 45 Japanese cars to 2000
  - C: 25 imported cars to 2000
  - D: 15 supercars with eight or more cylinders, any year

  Police, fire, Self-Defense Force and JAF vehicles are also shown. 2026 is the
  5th festival and the 2nd at Asuka.
prefecture: Nara
venue_en: Asuka village office car park and lawn, Tachibana, Asuka
venue_ja: 明日香村役場（駐車場／芝生広場特設会場）
street_address: 21 Tachibana, Asuka, Nara (奈良県高市郡明日香村大字橘21)
lat: 34.4707
lon: 135.8127
nearest_station: Asuka or Okadera (Kintetsu Yoshino line), each about 26 minutes' walk
access_notes_en: |
  - Bus: the Kame Bus from Asuka station to the village office, about 7 minutes, ¥220
  - Car: no parking at the venue. In 2026, a temporary car park at the village's neighbourhood park ground (明日香村近隣公園グラウンド), open 7:30 to 16:30
  - Shuttle: free from that car park to the venue, from 8:05 every 15 to 20 minutes
typical_scale: About 100 cars
spectator_fee_jpy: 0
spectator_notes_en: >
  Held in rain and cancelled in a storm. The organiser asks visitors to come by
  public transport.
last_verified: 2026-11-27
