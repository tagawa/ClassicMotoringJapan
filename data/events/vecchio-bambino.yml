slug: vecchio-bambino
name_en: Vecchio Bambino
name_ja: ベッキオ・バンビーノ
organizer: ベッキオ・バンビーノ実行委員会 (Vecchio Bambino organising committee)
official_url: https://vecchiobambino.com/
summary_en: >
  A two-day charity rally around Okayama Prefecture, first run in 2011 and held
  every spring and autumn since 2015. Both 2026 editions left Okayama Gokoku
  Shrine on the Saturday, stopped overnight at a hot-spring town, and finished
  at the Okayama Plaza Hotel on the Sunday. Entry centres on European cars built
  up to 1995, with priority for 1973 or earlier; American and Japanese cars are
  also accepted.
prefecture: Okayama
venue_en: Okayama Gokoku Shrine (start)
street_address: 3-21 Okuichi, Naka-ku, Okayama (岡山県岡山市中区奥市3-21)
lat: 34.6573
lon: 133.9551
access_notes_en: >
  Buses bound for Saidaiji from JR Okayama station take about 20 minutes to the
  Gokoku Jinja-mae stop, then it's about a 10-minute walk. After the start the
  rally is a moving event: the checkpoints are spread across the prefecture and
  most of them need a car to reach.
typical_eras: [1950s, 1960s, 1970s]
typical_scale: Around 60 to 80 cars
spectator_fee_jpy: 0
spectator_notes_en: >
  Free to watch from the roadside. The cars stop at every checkpoint, and the
  organiser asks spectators to wait at one; some have no spectator parking.
  Published times are for the lead car, and the last car can be up to 45 minutes
  behind. The final timetable appears on the official site about a week before
  each edition.
last_verified: 2026-10-05
