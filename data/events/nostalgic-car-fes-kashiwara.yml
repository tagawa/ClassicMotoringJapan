slug: nostalgic-car-fes-kashiwara
name_en: Nostalgic Car Fes
organizer: 柏原市商工会青年部OB会 (Kashiwara Chamber of Commerce Youth Division Alumni)
official_url: https://kashiwara-sci.org/
summary_en: >
  An open-air gathering of Japanese, American and European classics and
  neo-classics on the Yamato River flood plain at Kashiwara, south-east of Osaka.
  Up to 150 cars are admitted, alongside a swap meet and food trucks. It is run by
  the alumni of the local chamber of commerce's youth division.
prefecture: Osaka
venue_en: Yamato River riverside park, in front of Kashiwara City Hall
street_address: Ando-cho 1-banchi-saki, Kashiwara, Osaka (大阪府柏原市安堂町1番地先)
lat: 34.5781
lon: 135.6293
nearest_station: Ando (Kintetsu Osaka line)
access_notes_en: >
  The park is on the river bank in front of the city hall, about 250 m south of
  the station.
typical_scale: Up to 150 cars
spectator_fee_jpy: 0
spectator_notes_en: >
  The event goes ahead in light rain, but can be called off if a weather warning
  or a typhoon is forecast, since the site is a flood plain. The ground is
  unpaved. Cancellation is announced on the organiser's social media.
photography_notes_en: >
  Cars stay where they are parked for the duration: they cannot be moved once the
  event is running. The organiser may publish photographs and video of vehicles
  and of the event on social media.
last_verified: 2026-09-22
