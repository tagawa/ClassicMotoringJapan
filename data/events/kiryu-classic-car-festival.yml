slug: kiryu-classic-car-festival
name_en: Classic Car Festival in Kiryu
name_ja: クラシックカーフェスティバルin桐生
organizer: クラシックカーフェスティバルin桐生実行委員会 (Classic Car Festival in Kiryu Committee, at the Kiryu Chamber of Commerce)
official_url: https://www.ccf-kiryu.com/
summary_en: >
  About 200 cars built in 1980 or earlier, Japanese and imported, on show on
  Gunma University's Kiryu campus. Another 60 run a spot rally round Kiryu from
  the campus. There are food and goods stalls, a garage sale, a drawing contest
  for children and a talk run by the university. First held in 2006, always on
  this campus; the organiser counts close to 20,000 visitors at each edition.
prefecture: Gunma
venue_en: Gunma University, Kiryu campus
street_address: 1-5-1 Tenjincho, Kiryu, Gunma (群馬県桐生市天神町1-5-1)
lat: 36.4232
lon: 139.3485
nearest_station: Kiryu (JR Ryomo line)
access_notes_en: >
  Orihime buses from the north exit reach the Gunma Daigaku Kiryu Seimon-mae stop
  in about 7 minutes.
typical_scale: About 200 cars, plus 60 on the rally
spectator_fee_jpy: null
spectator_notes_en: >
  The festival runs in rain. At 15:00 the cars leave by the main gate and drive
  home along Honcho-dori, the town's main street.
last_verified: 2026-10-04
