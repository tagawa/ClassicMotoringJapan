route_en: >
  Held on the Saturday of Rally Japan 2026; the rally's own cars came north
  through Iwamura on a liaison section from 9:30. Times here are for the lead
  car, with the last due at Roman-tei by 11:00. The cars stood in the plaza and
  the Taisho-mura car park, in 110 marked spaces, until 15:00. The Akechi
  Culture Centre next door showed stage SS10 live and had rally cars on display.
