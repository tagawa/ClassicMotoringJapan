slug: takahata-classic-car-review
name_en: Classic Car Review in Takahata
name_ja: クラシックカーレビューIN高畠
organizer: 高畠町商工会 (Takahata Chamber of Commerce and Industry)
official_url: https://shokokai-takahata.or.jp/
summary_en: >
  About 200 original cars built in 1988 or earlier, Japanese and imported, line
  three shopping streets in the centre of Takahata, Yamagata. In the afternoon
  they drive through the town in a road safety parade. There is also a food
  market, live music and a race queen photo session. The 2026 edition is the
  14th.
prefecture: Yamagata
venue_en: Showa Enmusubi-dori, Mahoroba-dori and Chosha-dori shopping streets, Takahata
# No pin: neither GSI nor OpenStreetMap knows the streets by name.
nearest_station: Takahata (JR Yamagata Shinkansen and Ou line)
access_notes_en: >
  About 10 minutes by car from the station, and about 10 minutes from Nanyo-Takahata
  IC on the Tohoku-Chuo Expressway.
typical_scale: 180 to 200 cars
spectator_fee_jpy: 1500
spectator_notes_en: >
  ¥1,200 in advance, with a ¥500 shopping voucher for the day; ¥1,500 on the day.
  A ¥2,000 ticket includes the pamphlet, which has a photo of every car. Free for
  Takahata residents and for high school age and under. Advance tickets are sold
  through Lawson Ticket (L-code 22321). Runs in rain; cancelled in a storm.
last_verified: 2026-10-04
