slug: hachimaru-meeting
name_en: Hachimaru Meeting
name_ja: ハチマルミーティング
organizer: 株式会社芸文社 ハチマルヒーロー編集部 (Geibunsha, Hachimaru Hero editorial department)
official_url: https://nostalgicdayout.com/
summary_en: >
  A meeting for cars from the 1980s and 1990s, run by the magazine Hachimaru Hero. 
  It fills a car park inside [Fuji Speedway](https://en.fujispeedway.jp/)
  and shares the day with [Stancenation Japan](https://stancenation-japan.com/) 
  and other events at the circuit.
prefecture: Shizuoka
venue_en: Fuji Speedway
street_address: 694 Nakahinata, Oyama, Sunto District, Shizuoka (静岡県駿東郡小山町中日向694)
lat: 35.3721
lon: 138.9286
nearest_station: Gotemba (JR Gotemba line)
access_notes_en: >
  From Gotemba, the bus for Fuji Speedway takes about 25 minutes, getting off at 
  Fuji Speedway West Gate. It runs on weekends and public holidays only. 
  A taxi takes about 20 minutes and about ¥4,000. By car it's about 20
  minutes from Gotemba IC and about 10 minutes from Shin-Gotemba IC.
typical_eras: [1980s, 1990s]
spectator_fee_jpy: null
spectator_notes_en: >
  Admission for 2026 is not announced yet. In 2025, it was ¥500 for the meeting and a
  separate ¥1,200 Fuji Speedway entry fee per person. The meeting runs in rain or shine.
photography_notes_en: >
  The organizer may use photographs and video of the event in its own titles and
  on social media.
last_verified: 2026-09-23
