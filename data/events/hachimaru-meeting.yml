slug: hachimaru-meeting
name_en: Hachimaru Meeting
name_ja: ハチマルミーティング
organizer: 株式会社芸文社 ハチマルヒーロー編集部 (Geibunsha, Hachimaru Hero editorial department)
official_url: https://nostalgicdayout.com/
summary_en: >
  A meeting for cars sold new between 1980 and 1999, run by the editorial team of
  the magazine Hachimaru Hero. It fills a car park inside Fuji Speedway, which
  changes from year to year, and shares the day with Stancenation Japan and other
  events at the circuit. Entrants apply with a photograph of the car and are
  selected by the organizer.
prefecture: Shizuoka
venue_en: Fuji Speedway
street_address: 694 Nakahinata, Oyama, Sunto District, Shizuoka (静岡県駿東郡小山町中日向694)
lat: 35.3721
lon: 138.9286
nearest_station: Gotemba (JR Gotemba line)
access_notes_en: >
  From Gotemba, the bus for Fuji Speedway and Fuji Reien takes about 25 minutes,
  alighting at Fuji Speedway West Gate. It runs on weekends and public holidays
  only. A taxi takes about 20 minutes and about ¥3,500. By car it is about 20
  minutes from Gotemba IC and about 10 from Shin-Gotemba IC.
typical_eras: [1980s, 1990s]
spectator_fee_jpy: null
spectator_notes_en: >
  Admission for 2026 is not announced: the organizer lists the fee as undecided
  and tickets as coming soon. In 2025, visitors paid ¥500 to the meeting and a
  separate ¥1,200 Fuji Speedway gate fee each. The meeting runs in rain or shine.
photography_notes_en: >
  The organizer may use photographs and video of the event in its own titles and
  on social media.
last_verified: 2026-09-23
