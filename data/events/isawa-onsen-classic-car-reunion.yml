summary_en: >
  A classic car display on a public square in the hot-spring town of Isawa,
  held on the fourth Sunday of odd-numbered months. It revives the Isawa Onsen
  Classic Car Festa. Before July 2026 it met on the third Saturday at the Isawa
  Onsen footbath plaza.
