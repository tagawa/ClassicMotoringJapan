slug: hachioji-classic-car-parade
name_en: Hachioji Ginkgo Festival Classic Car Parade
name_ja: 八王子いちょう祭り クラシックカーパレード
organizer: クラシックカーパレードR実行委員会 (Classic Car Parade R Committee)
official_url: https://classiccar802.moo.jp/
summary_en: >
  About 100 cars built in 1975 or earlier, Japanese and imported, drive the
  ginkgo-lined Koshu-kaido during the Hachioji Ginkgo Festival, followed by police
  and fire service vehicles. The parade was one of the festival's three original
  events and runs as a road safety and disaster prevention campaign. It was
  revived after a gap, which is what the R in its Japanese name stands for.
prefecture: Tokyo
venue_en: Hachioji City Hall car park (start), then Koshu-kaido
street_address: 3-24-1 Motohongocho, Hachioji, Tokyo (東京都八王子市元本郷町3-24-1)
lat: 35.6664
lon: 139.3161
nearest_station: Nishi-Hachioji (JR Chuo line), beside the route
access_notes_en: >
  Koshu-kaido passes just north of the station. The cars gather at the city hall,
  north-east of the route, and join Koshu-kaido at Oiwake junction.
typical_scale: About 100 cars
spectator_fee_jpy: 0
spectator_notes_en: >
  Free to watch from the roadside. The city hall car park takes only the parade
  cars and staff.
last_verified: 2026-10-04
