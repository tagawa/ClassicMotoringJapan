# still on the server, read 2026-11-10. Same reading as 2026-spring.yml: class letter plus
# number, Unknown where the sheet gives no make or no model, nicknames and livery names
# left out. B7 and MA3 (リタイア, retired) and D5 (車両変更, car changed) name no car and are
# left out. The AR class is Alfa Romeo's; AR1, AR2, AR3, AR8 and AR9 are cut off at the
# sheet's column edge and completed where the cut-off text allows (AR3 stops at
# "GIULIETTA SF" and is given as Giulietta). Spelling corrected: "Spirnt", "Sptrint",
# "Coope". K2's "アメリア" is taken to be the car's name and left out.
# Hours are the time trial's, from the club's rules sheet (regulation220227.pdf).
