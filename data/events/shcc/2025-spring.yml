# The 72nd meeting. The cars are from the club's results sheet
# (https://shcc.info/documents/Result_72OISO_ALL.pdf), no longer linked from the site but
# still on the server, read 2026-11-10. Same reading as 2026-spring.yml: class letter plus
# number, Unknown where the sheet gives no make or no model, nicknames and livery names
# left out (MA7, MA9, D8, L1). MA8's "98" (98メイフェア) may be a year or a model
# name, so it gives no year. MA10 is cut off at the sheet's
# column edge after "1275S". The ACJ class, which includes modern cars, is in by the owner's
# decision (2026-11-10). ACJ435 is left out: the sheet marks it as ACJ409's car entered a
# second time (〃 Wエントリー).
# Hours are the time trial's, from the club's rules sheet (regulation220227.pdf).
