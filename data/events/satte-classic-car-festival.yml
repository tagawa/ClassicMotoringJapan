slug: satte-classic-car-festival
name_en: Satte Classic Car Festival
name_ja: 幸手クラシックカーフェスティバル
organizer: 埼玉クラシックカークラブ (Saitama Classic Car Club)
# The club has no website; its flyer is published through an entrant's blog.
official_url: https://minkara.carview.co.jp/userid/2251740/blog/49208302/
summary_en: >
  Up to 150 cars built in 1990 or earlier, kei cars included, plus later examples of
  the same models. Each entrant is interviewed about their car during the display,
  and three cars chosen by a selection panel receive special awards. Run by the
  Saitama Classic Car Club since 1995, with the backing of Satte city.
prefecture: Saitama
venue_en: Gongendo Park (Satte Gongendo Sakura Tsutsumi), car park
typical_scale: Up to 150 cars
spectator_fee_jpy: null
spectator_notes_en: >
  Admission is not announced. The festival runs in rain.
last_verified: 2026-09-24
