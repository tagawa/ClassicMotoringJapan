slug: nostalgic-2days
name_en: Nostalgic 2days
organizer: 株式会社芸文社 (Geibunsha)
official_url: https://nos2days.com/
summary_en: >
  An indoor show of classic cars, mostly Japanese, and the trade that restores
  them. It is run by Geibunsha, publisher of the magazines Nostalgic Hero and
  Hachimaru Hero. Dealers, parts makers and restoration specialists fill three
  exhibition halls, and some cars and parts are for sale on the stand.
prefecture: Kanagawa
venue_en: Pacifico Yokohama, Exhibition Halls B, C and D
venue_ja: パシフィコ横浜 展示ホールB・C・D
street_address: 1-1-1 Minatomirai, Nishi, Yokohama, Kanagawa (神奈川県横浜市西区みなとみらい1-1-1)
lat: 35.4600
lon: 139.6353
nearest_station: Minatomirai (Minatomirai line), or Sakuragicho (JR Negishi line, Yokohama Municipal Subway Blue Line)
access_notes_en: |
  On foot:
  - about 5 minutes from Minatomirai, through Queen's Square Yokohama and over the
    footbridge
  - about 12 minutes from Sakuragicho

  From Tokyo, Shinagawa, Haneda or Narita, change at Yokohama for the Minatomirai
  line.
spectator_fee_jpy: 4500
spectator_notes_en: |
  For 2027:
  - ¥3,500 in advance
  - ¥4,500 on the day

  Each ticket includes a ¥1,000 voucher. Free for primary school age and under.
  Last entry 16:30. Advance sales had not opened when this was checked.
