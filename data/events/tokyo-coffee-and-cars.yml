name_en: Tokyo Coffee and Cars
organizer: オクタン日本版編集部 (Octane Japan editorial team), with Bespoke Automotive
official_url: https://octane.jp/articles/detail/11825
# The site lists only the morning session, the one for older cars (owner, 2026-11-27).
summary_en: >
  A regular morning meeting of owners and their cars over coffee, from vintage
  cars to modern sports cars. In December 2026 it runs in two sessions by build
  year, and this site lists the morning one, for cars built up to 1990. Cars
  enter free by application, chosen by lot when oversubscribed. A coffee wagon
  sells drinks and light meals.
