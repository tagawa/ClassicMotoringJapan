slug: 20th-century-meeting
name_en: 20th Century Meeting
name_ja: 20世紀ミーティング
organizer: 20世紀ミーティング実行委員会 (20th Century Meeting Committee, at KYOWA Classic Car & Life Station)
official_url: https://niigata-kankou.or.jp/event/detail_44046.html
summary_en: >
  An owners' meeting for cars and motorcycles of every kind built up to about 2000,
  held each spring and autumn since 2021 on the Shinano riverside in Sanjo. The
  spring 2026 meeting had 128 cars and 26 motorcycles, built from the late 1950s to
  about 2008. There are also food trucks, a flea market and a clear-out auction.
prefecture: Niigata
venue_en: Mizbering Sanjo
