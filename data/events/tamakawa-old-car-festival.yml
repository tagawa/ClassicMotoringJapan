nearest_station: Izumigo (JR Suigun line), about 5 minutes by car
access_notes_en: >
  About 2 minutes by car from Fukushima Airport and about 5 minutes from Tamakawa
  IC on the Abukuma Kogen Road. Parking for 500 cars.
