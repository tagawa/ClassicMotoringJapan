slug: la-festa-autunno
name_en: La Festa Autunno
name_ja: ラ フェスタ アウトゥンノ
organizer: La Festa 1000 by FORZA S.p.A.
official_url: https://www.lafesta-autunno.com/
summary_en: >
  A four-day touring rally for pre-1968 classics, run every autumn since 1997.
  Around 60 to 70 cars leave Harajuku in Tokyo, tour Fukushima and the northern
  Kanto region over four days, and finish at Makuhari in Chiba. Only original
  cars built between 1919 and 1967 are eligible and replicas are not accepted.
  The event was called La Festa Mille Miglia until it was renamed in 2025.
prefecture: Tokyo
venue_en: Meiji Jingu and Omotesando, Harajuku (start)
street_address: 1-1 Yoyogikamizonocho, Shibuya, Tokyo (東京都渋谷区代々木神園町1-1)
lat: 35.6699
lon: 139.7023
nearest_station: Harajuku (JR Yamanote Line), or Meiji-jingumae for the Tokyo Metro lines
access_notes_en: >
  The start is a few minutes' walk from Harajuku station. Everything after that
  is a moving event: the checkpoints are spread over eight prefectures and most
  of them need a car to reach. The finish at Makuhari Bay Town is walkable from
  Kaihimmakuhari station on the JR Keiyo line.
typical_eras: [Prewar, 1940s, 1950s, 1960s]
typical_scale: Around 60 to 70 cars
spectator_fee_jpy: 0
spectator_notes_en: >
  Free to watch from the roadside, and free at the checkpoints. About two weeks
  beforehand the organiser publishes a timetable giving an arrival window for
  every checkpoint. The cars stop long enough at the bigger checkpoints for a
  close look. Windows shift with traffic on the day.
