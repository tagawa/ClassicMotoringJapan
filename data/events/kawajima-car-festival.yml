slug: kawajima-car-festival
name_en: Car Festival in Kawajima
name_ja: カーフェスティバル in Kawajima
organizer: 日本旧軽車会 (Nihon Kyukeisha-kai), with Kawajima town
# The club has no site of its own. This post reproduces its flyer, entry form and
# the town's car park map.
official_url: https://minkara.carview.co.jp/userid/2251740/blog/49037083/
summary_en: >
  Up to 300 vehicles built between 1946 and 2000 in the car park of Kawajima town
  hall: cars, kei cars, motorcycles, three-wheelers, lorries and buses. The
  Copen, Mitsuoka cars and supercars are accepted from any year. Places go to the
  first 300 entries, and there are 30 swap meet stalls.
prefecture: Saitama
venue_en: Kawajima Town Hall car park
street_address: 870-1 Shimoyatsubayashi, Kawajima, Saitama (埼玉県比企郡川島町大字下八ツ林870-1)
lat: 35.9925
lon: 139.4843
access_notes_en: >
  No station nearby. Tobu buses from Kawagoe or Konosu station stop at Yatsubayashi
  (Kawajima-machi Yakuba Iriguchi), 20 minutes' walk away. By car, 7 minutes from
  Kawajima IC on the Ken-O Expressway. Visitors' car parks around the town hall
  are free.
typical_scale: Up to 300 vehicles
spectator_fee_jpy: 0
spectator_notes_en: >
  Free to watch, and photography is allowed. The festival runs in rain.
last_verified: 2026-10-04
