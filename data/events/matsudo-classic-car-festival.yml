slug: matsudo-classic-car-festival
name_en: Matsudo Classic Car Festival
name_ja: まつどクラシックカーフェスティバル
organizer: まつどクラシックカーフェスティバル実行委員会 (Matsudo Classic Car Festival Executive Committee)
# The show has no site of its own. This is the Matsudo Festival it runs within; the
# show's own details come from the organiser's flyer and entry guide.
official_url: https://matsudo-cci.com/festival
summary_en: >
  A two-day show on the two basement floors of the car park under Matsudo station's
  west exit, held during the Matsudo Festival. About 120 Japanese and foreign cars
  are shown, built up to 1995, plus sports cars and other rare cars the organiser
  approves. Some owners run parts swaps from their spaces.
prefecture: Chiba
venue_en: Matsudo station west exit underground car park, floors B1 and B2
street_address: 24-3 Honcho, Matsudo, Chiba (千葉県松戸市本町24-3)
lat: 35.7845
lon: 139.8999
nearest_station: Matsudo (JR Joban line, Keisei Matsudo line)
access_notes_en: >
  The car park is under the west exit, partly beneath the station deck. Other
  vehicles cannot use it on either day.
typical_scale: About 120 cars
spectator_fee_jpy: 0
spectator_notes_en: >
  Free to watch. Open 11:00 to 17:00 on both days. Show cars arrive before 10:30 and
  leave after 17:30.
last_verified: 2026-09-27
