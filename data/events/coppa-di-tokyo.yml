slug: coppa-di-tokyo
name_en: Coppa di Tokyo
name_ja: コッパ ディ 東京
organizer: 汐留町会 (Shiodome neighbourhood association), run by the Coppa di Tokyo organising committee
official_url: https://www.coppa-di-tokyo.com/
summary_en: >
  A one-day rally from Shiodome's Italian quarter (Italia-gai) in central Tokyo.
  The cars gather in Shiodome Nishi Park, tour Tokyo roads and compete in timed
  trials (PC競技). Entry is for cars built up to 1976, with priority for 1966 or
  earlier and for models with racing history, such as at the Mille Miglia or Le
  Mans; the organiser decides on anything later. Bubble cars and kei cars under
  360cc have their own class.
prefecture: Tokyo
venue_en: Shiodome Nishi Park, Shiodome Italia-gai
street_address: 2-17-1 Higashi-Shimbashi, Minato, Tokyo (東京都港区東新橋2-17-1)
lat: 35.6612
lon: 139.7577
nearest_station: Shiodome (Toei Oedo line and Yurikamome), or Shimbashi for the JR lines
access_notes_en: >
  In a straight line the park is about 300 metres from Shiodome station and
  about 550 metres from JR Shimbashi. The organiser asks people coming to watch
  to use public transport: only registered cars may enter the park, and there
  is little paid parking nearby.
typical_scale: Up to 77 cars in 2026 (70, plus 7 bubble cars)
# The organiser's site states no admission. Free is from Stripes Japan's listing for
# the 2024 edition ("Admission: Free"); the venue is a public park and public roads.
spectator_fee_jpy: 0
spectator_notes_en: >
  Free to watch, in the park and from the roadside.
last_verified: 2026-10-13
