route_en: >
  The 28th running. Cars gathered at the shrine from 07:00 and set off from
  08:30. Saturday's leg ran through Akaiwa, Bizen, Setouchi, Wake and Mimasaka to
  an overnight stop at Yubara Onsen; Sunday's went through Kagamino, Hiruzen and
  Misaki back to Okayama. Times are for the lead car, with the last car up to 45
  minutes behind.
